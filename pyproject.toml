[project]
name = "jp-stock-pipeline"
version = "0.1.0"
description = "日本株データ収集基盤: 無料ソースから収集し Notion に構造化格納するパイプライン"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "yfinance>=0.2.50",
    # notion-client は 2.6.0 で databases.query を廃止し data_sources.query へ移行
    # した。現行コードは databases.query 前提（単一データソースの DB）のため、それが
    # 残る最終版 2.5.x に固定する（file_uploads は raw_api 直叩きなので SDK 版非依存）。
    # data_sources API への移行は別途フォローアップ。
    "notion-client>=2.5,<2.6",
    "lxml>=5.2",
    "pypdfium2>=4.30",
    "tenacity>=9.0",
    # ローカル端末への dual-write(②時系列含む)+ FastAPI 配信
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Cloudflare R2 への投入は S3 互換 API を使う。R2 の Cloudflare REST API は
    # 1,200 req/5分 の制限があり日次 4,445 PUT に足りない (CF-CANONICAL-DESIGN §2.4)。
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_stock_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
