[project]
name = "jp-stock-pipeline"
version = "0.1.0"
description = "日本株データ収集基盤: 無料ソースから収集し Notion に構造化格納するパイプライン"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "yfinance>=0.2.50",
    "notion-client>=2.2.1",
    "lxml>=5.2",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "pypdfium2>=4.30",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_stock_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
