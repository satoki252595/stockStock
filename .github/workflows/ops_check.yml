# 鮮度とジョブ結果の SLO 判定。何も書かず、違反があれば Issue を立てる。
#
# 「壊れても音が鳴らない」を塞ぐための層。実測で次が誰にも気づかれなかった:
#   EDINET 11 営業日連続 processed=0 で「成功」/ JPX 404 で銘柄マスタ 33 日停止
#   優待 81.5 日停止 / 14 workflow に失敗通知 0 行
#
# 正常なら何も出さない。異常時だけ Issue が 1 本立つ。
name: ops_check

on:
  schedule:
    # 日次ジョブが出揃った後。10:00 UTC = 19:00 JST
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ops_check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # SLO 違反時に Issue を立てるため

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      - name: Run ops_check
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_JOB_LOG: ${{ secrets.NOTION_DB_JOB_LOG }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: nix develop -c uv run python -m jp_stock_pipeline.jobs.ops_check

      - name: SLO 違反を Issue に出す
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[SLO違反] データの鮮度またはジョブ結果"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf 'SLO 違反を検知しました。\n\n実行ログ: %s\n検知: %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M UTC')")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
