# JPX 信用残 → R2 vwap-data/margin （移行 P2）
#
# ⚠️ **schedule は意図的に無効にしてある。** この writer は現在 kabulab-cf の
# vwap-ingest.yml（土 09:00 UTC = 18:00 JST）が担っており、両方が動くと
# 二重 writer になる（移行規則 M1「並行期間はキー空間を物理的に分ける」と
# M4「writer 二重稼働」に違反する）。
#
# 切替手順（2026-09-28 の JPX 様式変更に合わせる）:
#   2026-09-26(土) 18:00 JST  kabulab-cf が最後の週次分を書く
#   2026-09-26(土) 19:00 JST  kabulab-cf の margin cron 行をコメントアウトして push
#   2026-09-28(月) 以降        このファイルの schedule を有効化し stockStock が書く
# 旧 writer の最後と新 writer の最初の間が 48 時間空くので、構造的に無衝突。
#
# 切替前は workflow_dispatch の --check-only で差分だけ確認できる（1バイトも書かない）。
name: margin_weekly

on:
  # schedule:
  #   # 切替後に有効化する。日次様式（2026-09-28〜）は 16:00 JST 公表なので
  #   # 余裕を見て 17:30 JST = 08:30 UTC。毎時0分は混雑するため 30 分にずらす。
  #   - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      check_only:
        description: "R2 へ書かず現状との差分だけ報告する"
        type: boolean
        default: true

concurrency:
  group: margin_weekly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      - name: Run margin_weekly
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
          NOTION_DB_FINANCIALS: ${{ secrets.NOTION_DB_FINANCIALS }}
          NOTION_DB_DISCLOSURES: ${{ secrets.NOTION_DB_DISCLOSURES }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          nix develop -c uv run python -m jp_stock_pipeline.jobs.margin_weekly \
            ${{ inputs.check_only && '--check-only' || '' }}

      # 失敗に気づく唯一の経路。これまで 14 workflow に `if: failure()` も
      # webhook も 0 行で、EDINET が 11 営業日空振りしても、JPX の 404 で
      # 銘柄マスタが 33 日止まっても誰も気づかなかった。
      # 通知先を増やすと見なくなるので GitHub Issue を 1 本だけ立てる
      # （既に open があれば重複させずコメントを足す）。
      - name: 失敗したら Issue を立てる
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[ジョブ失敗] $WF"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '%s が失敗しました。\n\n実行: %s\n検知: %s' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M UTC')")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
