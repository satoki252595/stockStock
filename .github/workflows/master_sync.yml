# 毎月1日 6:00 JST (DESIGN.md §8.2)。cron は UTC 表記
name: master_sync

on:
  schedule:
    - cron: "0 21 1 * *"
  workflow_dispatch:

concurrency:
  group: master_sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 初回フルロードは ~3900 銘柄 × 2.5req/s スロットルで ~52分かかる。60分では
    # ネットワーク遅延/リトライで超過し cancelled になるため余裕を持たせる
    # (edinet/export と同じ 120)。upsert の per-record クエリ排除でさらに半減予定。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      # dual-write 先サーバ(tailnet)へ到達するため runner を tailnet に参加させる。
      # OAuth Secrets 未設定なら失敗するが収集は継続(Notion のみ=dual-write degrade)。
      - name: Join tailnet
        uses: tailscale/github-action@v3
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Run master_sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
          NOTION_DB_PRICES: ${{ secrets.NOTION_DB_PRICES }}
          NOTION_DB_FINANCIALS: ${{ secrets.NOTION_DB_FINANCIALS }}
          NOTION_DB_DISCLOSURES: ${{ secrets.NOTION_DB_DISCLOSURES }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          NOTION_DB_EXPORTS: ${{ secrets.NOTION_DB_EXPORTS }}
          NOTION_DB_JOB_LOG: ${{ secrets.NOTION_DB_JOB_LOG }}
          # クラウド → 端末B PostgreSQL への dual-write (未設定なら Notion のみ)。
          # 直公開は危険なため VPN(Tailscale 等)経由を推奨。sslmode 既定は require。
          LOCAL_DB_HOST: ${{ secrets.LOCAL_DB_HOST }}
          LOCAL_DB_PORT: ${{ secrets.LOCAL_DB_PORT }}
          LOCAL_DB_NAME: ${{ secrets.LOCAL_DB_NAME }}
          LOCAL_DB_USER: ${{ secrets.LOCAL_DB_USER }}
          LOCAL_DB_PASSWORD: ${{ secrets.LOCAL_DB_PASSWORD }}
          LOCAL_DB_SSLMODE: ${{ secrets.LOCAL_DB_SSLMODE }}
        run: nix develop -c uv run python -m jp_stock_pipeline.jobs.master_sync
