name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      - name: Lint (ruff)
        run: nix develop -c uv run ruff check src tests
      - name: Test
        run: nix develop -c uv run pytest
      # 配信 Worker (worker/) は TypeScript。Python と同じ nix devShell の
      # node/pnpm を使う（グローバルへは入れない）。
      - name: Install worker deps
        run: nix develop -c bash -c 'cd worker && pnpm install --frozen-lockfile'
      - name: Typecheck worker
        run: nix develop -c bash -c 'cd worker && pnpm typecheck'
      - name: Test worker
        run: nix develop -c bash -c 'cd worker && pnpm test'
