name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      - name: Lint (ruff)
        run: nix develop -c uv run ruff check src tests
      - name: Test
        run: nix develop -c uv run pytest
      # 配信 Worker (worker/) は TypeScript。Python と同じ nix devShell の
      # node/pnpm を使う（グローバルへは入れない）。
      - name: Install worker deps
        run: nix develop -c bash -c 'cd worker && pnpm install --frozen-lockfile'
      - name: Typecheck worker
        run: nix develop -c bash -c 'cd worker && pnpm typecheck'
      - name: Test worker
        run: nix develop -c bash -c 'cd worker && pnpm test'

      # 失敗に気づく唯一の経路。これまで 14 workflow に `if: failure()` も
      # webhook も 0 行で、EDINET が 11 営業日空振りしても、JPX の 404 で
      # 銘柄マスタが 33 日止まっても誰も気づかなかった。
      # 通知先を増やすと見なくなるので GitHub Issue を 1 本だけ立てる
      # （既に open があれば重複させずコメントを足す）。
      - name: 失敗したら Issue を立てる
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[ジョブ失敗] $WF"
          export TITLE  # jq の env.TITLE 用（gh issue list に --arg は無い）
          # 部分一致 (in:title) では無関係な Issue を拾う。タイトル一覧を
          # 取って jq で完全一致させる（ops_check.yml と同じ形。L-37）。
          EXISTING=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          BODY=$(printf '%s が失敗しました。\n\n実行: %s\n検知: %s' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M UTC')")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

