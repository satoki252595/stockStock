name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      - name: Lint (ruff)
        run: nix develop -c uv run ruff check src tests
      - name: Test
        run: nix develop -c uv run pytest
      # 配信 Worker (worker/) は TypeScript。Python と同じ nix devShell の
      # node/pnpm を使う（グローバルへは入れない）。
      - name: Install worker deps
        run: nix develop -c bash -c 'cd worker && pnpm install --frozen-lockfile'
      - name: Typecheck worker
        run: nix develop -c bash -c 'cd worker && pnpm typecheck'
      - name: Test worker
        run: nix develop -c bash -c 'cd worker && pnpm test'

      # 失敗に気づく唯一の経路。これまで 14 workflow に `if: failure()` も
      # webhook も 0 行で、EDINET が 11 営業日空振りしても、JPX の 404 で
      # 銘柄マスタが 33 日止まっても誰も気づかなかった。
      # 通知先を増やすと見なくなるので GitHub Issue を 1 本だけ立てる
      # （既に open があれば重複させずコメントを足す）。
      - name: 失敗したら Issue を立てる
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[ジョブ失敗] $WF"
          export TITLE  # jq の env.TITLE 用（gh issue list に --arg は無い）
          # 部分一致 (in:title) では無関係な Issue を拾う。タイトル一覧を
          # 取って jq で完全一致させる（ops_check.yml と同じ形。L-37）。
          EXISTING=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          BODY=$(printf '%s が失敗しました。\n\n実行: %s\n検知: %s' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M UTC')")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  # 共有契約ファイルが 2 リポジトリで一致しているかを見る。
  # 対象は銘柄コードのテストベクタと、D1 の列単位ライセンス地図。
  #
  # ## なぜ相手リポを checkout するのか
  # 「自リポの JSON を自リポにハードコードしたハッシュと比べる」方式では、
  # 検出できるのは自リポ内の改竄だけで、本来防ぎたい 2 リポ間の乖離は素通りする
  # （どちらのリポも自分の中では整合したまま別の値へ動ける）。両リポジトリとも
  # public なので、secret 無しで相手を checkout して実ファイルを diff できる。
  #
  # ## このジョブが保証すること / しないこと
  #  - する: 両リポの stock-code-vectors.json がバイト単位で同一であること。
  #    各リポの単体テストが「自リポの実装 == 自リポのベクタ」を保証しているので、
  #    両者を合わせると**ベクタに列挙した入力について**実装の一致が言える。
  #  - しない: ベクタに無い入力での一致。実装の等価性そのものではない。
  #  - しない: 相手リポに変更を強制すること。片側でベクタを変えるともう片側の
  #    CI が赤くなる（意図した結合）が、赤いまま main にマージする権限は残る。
  #  - する: 相手リポからベクタが消えたら落ちること。相手ファイル不在で緑に
  #    なるのは**自 main にもまだベクタが無い移行期だけ**に限っている
  #    （無条件に通すと、相手がファイルを消した瞬間に突合が緑のまま無効化される）。
  cross-repo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: kabulab-cf (TypeScript 側) を取得
        uses: actions/checkout@v4
        with:
          repository: satoki252595/kabulab_tool_cloudflare
          path: .peer-kabulab-cf
          persist-credentials: false
      # 対象ファイルを増やすので、1 ファイル分の手順を関数にして呼ぶ形にした
      # （複製すると片方だけ直される。移行期の猶予判定はコピーしてはいけない
      # 種類のロジックである）。判定とメッセージは従来と 1:1 で同じ。
      - name: 共有契約ファイルを突合
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # $3 に pending-peer を渡すと、相手リポにファイルが無い場合を
          # **無条件に warning へ落とす**。導入したばかりのファイル専用の猶予で、
          # 相手リポへ入ったら必ずこの引数を外すこと（外し忘れると「相手が
          # 消しても緑」になり、この突合が意味を失う）。下の既定経路は
          # 「自 main にあるのに相手に無い = 共有の破棄」で落とす。
          compare_contract() {
            REL="$1"
            LABEL="$2"
            GRACE="${3:-}"
            MINE="$REL"
            PEER=".peer-kabulab-cf/$REL"
            test -f "$MINE" || { echo "::error::$MINE が無い"; return 1; }
            if [ ! -f "$PEER" ] && [ "$GRACE" = "pending-peer" ]; then
              echo "::warning::${LABEL}を相手リポへ導入していない（pending-peer）。"
              echo "::warning::kabulab-cf 側へ $REL を入れたら ci.yml の pending-peer を外すこと。"
              return 0
            fi
            if [ ! -f "$PEER" ]; then
              # 移行期の例外はここだけ。**自リポの main にまだファイルが無い間**に
              # 限って通す。両リポへ入り終わった後 (= 自 main にファイルがある) の
              # 相手側の欠落は「導入途中」ではなく「共有の破棄」なので必ず落とす。
              # 無条件に exit 0 にすると、相手がファイルを移動・改名した瞬間に
              # この突合が「緑のまま無効化」され、乖離検出を謳ったジョブが
              # 何も見ていない状態になる。
              if ! git fetch --depth=1 origin "$DEFAULT_BRANCH" >/dev/null 2>&1; then
                echo "::error::自リポ $DEFAULT_BRANCH を取得できず、移行期か共有破棄かを判別できない。"
                return 1
              fi
              if git cat-file -e "FETCH_HEAD:$MINE" 2>/dev/null; then
                echo "::error::自リポ $DEFAULT_BRANCH には $MINE があるのに相手リポに無い。"
                echo "::error::${LABEL}の片側削除・移動を疑うこと（移行期の猶予は既に終了している）。"
                return 1
              fi
              echo "::warning::相手リポに $PEER が無い（両リポへの導入が完了していない）。突合をスキップ。"
              return 0
            fi
            if ! diff -u "$PEER" "$MINE"; then
              echo "::error::${LABEL}が 2 リポジトリ間で乖離している。"
              echo "::error::どちらが正かを決めて両リポジトリを同時に直すこと。"
              return 1
            fi
            echo "${LABEL}は両リポジトリで一致している。"
          }
          compare_contract tests/fixtures/contracts/stock-code-vectors.json "銘柄コード共有テストベクタ"
          compare_contract tests/fixtures/contracts/d1-license-map.json "D1 列単位ライセンス地図の契約"
