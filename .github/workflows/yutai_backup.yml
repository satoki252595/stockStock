# ⑨優待の LLM 派生値を R2 jp-stock-supply へ退避する（移行 P3）
#
# ⚠️ **定期実行しない。** これは移行元 kabulab-cf の D1 から
# `short_summary` / `estimated_value` だけを読み出す保険であり、日次で回す
# 種類のジョブではない。退避先キーは内容の SHA256 で決まるので、同じ中身を
# 何度流しても R2 上のオブジェクトは増えない（重複を作らない）。
#
# 出典サイトの掲載文 `description` は退避しない（規約上、蓄積も再掲も不可）。
# personal-only のため、公開 Worker が bind していない jp-stock-supply に置く。
#
# 必要な追加 Secret: KABULAB_D1_DATABASE_ID（kabulab-cf の D1 データベース ID）。
# 未設定なら何も書かずに終了する。CF_API_TOKEN は同一アカウントの D1 読み取り権限が要る。
name: yutai_backup

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "R2 へ書かず、退避対象と件数だけ報告する"
        type: boolean
        default: true
      allow_shrink:
        description: "前回退避より件数が減っていても退避する（優待廃止などで意図的に減る場合）"
        type: boolean
        default: false

concurrency:
  group: yutai_backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      - name: Run yutai_backup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
          NOTION_DB_FINANCIALS: ${{ secrets.NOTION_DB_FINANCIALS }}
          NOTION_DB_DISCLOSURES: ${{ secrets.NOTION_DB_DISCLOSURES }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          KABULAB_D1_DATABASE_ID: ${{ secrets.KABULAB_D1_DATABASE_ID }}
        run: |
          nix develop -c uv run python -m jp_stock_pipeline.jobs.yutai_backup \
            ${{ inputs.check_only && '--check-only' || '' }} \
            ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      # 失敗に気づく唯一の経路。これまで 14 workflow に `if: failure()` も
      # webhook も 0 行で、EDINET が 11 営業日空振りしても、JPX の 404 で
      # 銘柄マスタが 33 日止まっても誰も気づかなかった。
      # 通知先を増やすと見なくなるので GitHub Issue を 1 本だけ立てる
      # （既に open があれば重複させずコメントを足す）。
      - name: 失敗したら Issue を立てる
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[ジョブ失敗] $WF"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '%s が失敗しました。\n\n実行: %s\n検知: %s' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M UTC')")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
