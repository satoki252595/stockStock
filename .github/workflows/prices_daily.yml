# 毎営業日 19:30 JST (DESIGN.md §8.2)。cron は UTC 表記。
# 履歴子DBを既定オフにしたので Notion 側は 60〜73 分、CF 側 17〜21 分を足して
# 77〜94 分の見込み。実測が安定するまで 150 分で余裕を取る。
name: prices_daily

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: prices_daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      # dual-write 先サーバ(tailnet)へ到達するため runner を tailnet に参加させる。
      # OAuth Secrets 未設定なら失敗するが収集は継続(Notion のみ=dual-write degrade)。
      - name: Join tailnet
        uses: tailscale/github-action@v3
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Run prices_daily
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
          NOTION_DB_PRICES: ${{ secrets.NOTION_DB_PRICES }}
          NOTION_DB_FINANCIALS: ${{ secrets.NOTION_DB_FINANCIALS }}
          NOTION_DB_DISCLOSURES: ${{ secrets.NOTION_DB_DISCLOSURES }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          NOTION_DB_EXPORTS: ${{ secrets.NOTION_DB_EXPORTS }}
          NOTION_DB_JOB_LOG: ${{ secrets.NOTION_DB_JOB_LOG }}
          # Cloudflare 正本 (R2 + D1)。未設定なら enabled()=False で何も書かない。
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          # クラウド → 端末B PostgreSQL への dual-write (未設定なら Notion のみ)。
          # 直公開は危険なため VPN(Tailscale 等)経由を推奨。sslmode 既定は require。
          LOCAL_DB_HOST: ${{ secrets.LOCAL_DB_HOST }}
          LOCAL_DB_PORT: ${{ secrets.LOCAL_DB_PORT }}
          LOCAL_DB_NAME: ${{ secrets.LOCAL_DB_NAME }}
          LOCAL_DB_USER: ${{ secrets.LOCAL_DB_USER }}
          LOCAL_DB_PASSWORD: ${{ secrets.LOCAL_DB_PASSWORD }}
          LOCAL_DB_SSLMODE: ${{ secrets.LOCAL_DB_SSLMODE }}
        run: nix develop -c uv run python -m jp_stock_pipeline.jobs.prices_daily
