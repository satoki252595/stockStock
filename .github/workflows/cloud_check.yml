# Cloudflare 正本への疎通確認。手動実行のみ（cron なし）。読み取りだけで何も書かない。
name: cloud_check

on:
  workflow_dispatch:

concurrency:
  group: cloud_check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c uv sync
      - name: Run cloud_check
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
          NOTION_DB_FINANCIALS: ${{ secrets.NOTION_DB_FINANCIALS }}
          NOTION_DB_DISCLOSURES: ${{ secrets.NOTION_DB_DISCLOSURES }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          # Cloudflare 正本 (R2 + D1)
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: nix develop -c uv run python -m jp_stock_pipeline.jobs.cloud_check

      # 失敗に気づく唯一の経路。これまで 14 workflow に `if: failure()` も
      # webhook も 0 行で、EDINET が 11 営業日空振りしても、JPX の 404 で
      # 銘柄マスタが 33 日止まっても誰も気づかなかった。
      # 通知先を増やすと見なくなるので GitHub Issue を 1 本だけ立てる
      # （既に open があれば重複させずコメントを足す）。
      - name: 失敗したら Issue を立てる
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[ジョブ失敗] $WF"
          # 部分一致 (in:title) では無関係な Issue を拾う。タイトル一覧を
          # 取って jq で完全一致させる（ops_check.yml と同じ形。L-37）。
          EXISTING=$(gh issue list --state open --limit 200 --json number,title \
            --jq --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          BODY=$(printf '%s が失敗しました。\n\n実行: %s\n検知: %s' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M UTC')")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
